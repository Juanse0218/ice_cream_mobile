
name: ice_cream_mobile
description: "Aplicación ICE CREAM."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  http: ^1.6.0
  fl_chart: ^1.3.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: 22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/heladoCool.png"
  adaptive_icon_background: "#FFF5F9"
  adaptive_icon_foreground: "assets/images/heladoCool.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
